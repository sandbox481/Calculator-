


<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi Calculator</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    html, body { height: 100%; margin: 0; }
    * { box-sizing: border-box; }
    .font-display { font-family: 'Space Mono', monospace; }
    .font-body { font-family: 'DM Sans', sans-serif; }
    .calc-btn {
      transition: all 0.12s ease;
      user-select: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      border-radius: 12px;
      font-weight: 600;
    }
    .calc-btn:active { transform: scale(0.93); opacity: 0.6; }
    .calc-btn.pressed { opacity: 0.6 !important; }
    .tab-btn { transition: all 0.2s ease; cursor: pointer; white-space: nowrap; }
    .tab-btn.active { transform: translateY(-1px); }
    .result-flash { animation: flashIn 0.3s ease; }
    @keyframes flashIn { 0% { opacity: 0.5; transform: scale(0.98); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes slideUp { 0% { transform: translateX(-50%) translateY(100px); opacity: 0; } 100% { transform: translateX(-50%) translateY(0); opacity: 1; } }
    @keyframes slideDown { 0% { transform: translateX(-50%) translateY(0); opacity: 1; } 100% { transform: translateX(-50%) translateY(100px); opacity: 0; } }
    .mode-enter { animation: modeSlide 0.25s ease; }
    @keyframes modeSlide { 0% { opacity: 0; transform: translateY(8px); } 100% { opacity: 1; transform: translateY(0); } }
    ::-webkit-scrollbar { height: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; }
  </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full font-body">
  <div id="app" class="h-full w-full flex" style="background:#0f0f13;">
   <!-- Sliding Sidebar Left -->
   <div class="fixed left-0 top-0 h-full w-72 z-50 transition-transform duration-300 ease-out flex flex-col" id="sidebar" style="background:#1a1a24;transform:translateX(-100%)">
    <div class="p-4 flex items-center justify-between border-b" style="border-color:#6b6b8022">
     <h2 class="font-display font-bold text-sm" style="color:#e8e6f0">Tools</h2><button id="closeSidebar" class="p-1 hover:opacity-70 transition" onclick="toggleSidebar()"><i data-lucide="x" style="width:18px;height:18px;color:#e8e6f0"></i></button>
    </div>
    <div class="flex-1 overflow-y-auto p-2" id="toolList"></div>
   </div><!-- Sliding History Right -->
   <div class="fixed right-0 top-0 h-full w-72 z-50 transition-transform duration-300 ease-out flex flex-col" id="historyPanel" style="background:#1a1a24;transform:translateX(100%)">
    <div class="p-4 flex items-center justify-between border-b" style="border-color:#6b6b8022">
     <h2 class="font-display font-bold text-sm" style="color:#e8e6f0">History</h2>
     <div class="flex gap-1">
      <button id="copyHistory" class="p-1 hover:opacity-70 transition" onclick="copyAllHistory()" title="Copy all"><i data-lucide="copy" style="width:16px;height:16px;color:#00ff00"></i></button> <button id="clearHistory" class="p-1 hover:opacity-70 transition" onclick="clearAllHistory()" title="Clear"><i data-lucide="trash-2" style="width:16px;height:16px;color:#ff4444"></i></button> <button id="closeHistory" class="p-1 hover:opacity-70 transition" onclick="toggleHistory()"><i data-lucide="x" style="width:18px;height:18px;color:#e8e6f0"></i></button>
     </div>
    </div>
    <div class="flex-1 overflow-y-auto p-3 space-y-1" id="historyListPanel"></div>
   </div><!-- Main Content -->
   <div class="flex-1 flex flex-col">
    <!-- Header -->
    <header class="px-5 pt-5 pb-2 flex items-center gap-3 justify-between">
     <div class="flex items-center gap-3"><button id="menuBtn" class="p-1 hover:opacity-70 transition" onclick="toggleSidebar()"><i data-lucide="menu" style="width:18px;height:18px;color:#00ff00"></i></button>
      <div class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:#00ff00">
       <i data-lucide="calculator" style="width:18px;height:18px;color:#0f0f13;"></i>
      </div>
      <h1 id="appTitle" class="font-display text-lg font-bold" style="color:#e8e6f0">Multi Toolkit</h1>
     </div><button id="historyBtn" class="p-1 hover:opacity-70 transition" onclick="toggleHistory()"><i data-lucide="history" style="width:18px;height:18px;color:#00ff00"></i></button>
    </header><!-- Content -->
    <main class="flex-1 px-4 pb-5 overflow-auto">
     <div id="modeContent" class="mode-enter"></div>
    </main>
   </div>
  </div>
  <script>
    const modes = [
      { id:'basic', label:'Basic Calc', icon:'calculator' },
      { id:'scientific', label:'Scientific', icon:'flask-conical' },
      { id:'programmer', label:'Programmer', icon:'binary' },
      { id:'stopwatch', label:'Stopwatch', icon:'timer' },
      { id:'equation', label:'Equation Solver', icon:'lightbulb' },
      { id:'bmi', label:'BMI', icon:'heart-pulse' },
      { id:'age', label:'Age', icon:'cake' },
      { id:'unit', label:'Units', icon:'ruler' },
      { id:'cooking', label:'Cooking', icon:'utensils' },
      { id:'currency', label:'Currency', icon:'dollar-sign' },
      { id:'timezone', label:'Timezone', icon:'globe' },
      { id:'mortgage', label:'Mortgage', icon:'home' },
      { id:'percentage', label:'Percentage', icon:'percent' },
      { id:'tip', label:'Tip Split', icon:'split-square-vertical' },
      { id:'discount', label:'Discount', icon:'tag' },
      { id:'shopping', label:'Shopping', icon:'shopping-cart' },
      { id:'geometry', label:'Geometry', icon:'hexagon' },
    ];

    let currentMode = 'basic';
    let calcDisplay = '0';
    let calcPrev = '';
    let calcOp = '';
    let calcReset = false;
    let sciDeg = true;
    let stopwatchRunning = false;
    let stopwatchTime = 0;
    let stopwatchInterval = null;
    let calcHistory = [];
    let calcHistoryIndex = 0;
    let fullHistory = [];

    const BG = '#0f0f13';
    const SURFACE = '#1a1a24';
    const ACCENT = '#00ff00';
    const TEXT = '#e8e6f0';
    const DIM = '#6b6b80';

    const defaultConfig = {
      app_title: 'Multi Toolkit',
      calculator_name: 'Multi Calculator',
      background_color: BG,
      surface_color: SURFACE,
      text_color: TEXT,
      primary_action_color: ACCENT,
      secondary_action_color: DIM
    };

    function applyConfig(cfg) {
      const bg = cfg.background_color || defaultConfig.background_color;
      const sf = cfg.surface_color || defaultConfig.surface_color;
      const tx = cfg.text_color || defaultConfig.text_color;
      const ac = cfg.primary_action_color || defaultConfig.primary_action_color;
      const dm = cfg.secondary_action_color || defaultConfig.secondary_action_color;

      document.getElementById('app').style.background = bg;
      const title = document.getElementById('appTitle');
      if (title) { title.textContent = cfg.calculator_name || defaultConfig.calculator_name; title.style.color = tx; }

      const icon = title?.previousElementSibling;
      if (icon) icon.style.background = ac;

      document.querySelectorAll('.tab-btn').forEach(t => {
        const active = t.dataset.mode === currentMode;
        t.style.background = active ? ACCENT : SURFACE;
        t.style.color = active ? '#0f0f13' : DIM;
      });

      document.querySelectorAll('.surface-bg').forEach(el => el.style.background = sf);
      document.querySelectorAll('.accent-bg').forEach(el => el.style.background = ac);
      document.querySelectorAll('.text-main').forEach(el => el.style.color = tx);
      document.querySelectorAll('.text-dim').forEach(el => el.style.color = dm);
      document.querySelectorAll('.accent-text').forEach(el => el.style.color = ac);
      document.querySelectorAll('.calc-num').forEach(el => { el.style.background = sf; el.style.color = tx; });
      document.querySelectorAll('.calc-op').forEach(el => { el.style.background = ac+'44'; el.style.color = ac; });
      document.querySelectorAll('.calc-accent').forEach(el => { el.style.background = ac; el.style.color = '#fff'; });
      document.querySelectorAll('.calc-func').forEach(el => { el.style.background = ac+'55'; el.style.color = ac; });
      document.querySelectorAll('.input-field').forEach(el => { el.style.background = sf; el.style.color = tx; el.style.borderColor = dm+'44'; });
      document.querySelectorAll('.result-box').forEach(el => { el.style.background = ac+'15'; el.style.borderColor = ac+'33'; });
    }

    // Tabs
    function renderTabs() {
      const list = document.getElementById('toolList');
      list.innerHTML = '';
      modes.forEach(m => {
        const btn = document.createElement('button');
        btn.className = 'w-full text-left px-3 py-2.5 rounded-lg text-sm font-semibold transition-all mb-1 tool-btn';
        btn.dataset.mode = m.id;
        btn.innerHTML = `<i data-lucide="${m.icon}" style="width:14px;height:14px;display:inline;margin-right:8px;"></i>${m.label}`;
        btn.onclick = () => { 
          currentMode = m.id;
          // Update all tool buttons
          document.querySelectorAll('.tool-btn').forEach(b => {
            if (b.dataset.mode === currentMode) {
              b.style.background = ACCENT;
              b.style.color = '#0f0f13';
            } else {
              b.style.background = SURFACE;
              b.style.color = TEXT;
            }
          });
          renderMode();
          toggleSidebar();
          applyConfig(window.elementSdk?.config || defaultConfig);
        };
        btn.style.background = currentMode === m.id ? ACCENT : SURFACE;
        btn.style.color = currentMode === m.id ? '#0f0f13' : TEXT;
        list.appendChild(btn);
      });
      lucide.createIcons();
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      sidebar.style.transform = sidebar.style.transform === 'translateX(0px)' ? 'translateX(-100%)' : 'translateX(0px)';
    }

    function toggleHistory() {
      const panel = document.getElementById('historyPanel');
      panel.style.transform = panel.style.transform === 'translateX(0px)' ? 'translateX(100%)' : 'translateX(0px)';
    }

    window.copyAllHistory = function() {
      const copyBtn = document.getElementById('copyHistory');
      copyBtn.style.opacity = '0.5';
      const items = fullHistory.map(h => `[${h.tool}] ${h.calculation} = ${h.result}`).join('\n');
      navigator.clipboard.writeText(items).then(() => {
        showConfirmation('History copied to clipboard!');
        setTimeout(() => { copyBtn.style.opacity = '1'; }, 300);
      }).catch(err => {
        showConfirmation('Failed to copy history');
        setTimeout(() => { copyBtn.style.opacity = '1'; }, 300);
      });
    };

    window.clearAllHistory = function() {
      showConfirmationDialog('Clear all history?', function() {
        fullHistory = [];
        calcHistory = [];
        calcHistoryIndex = 0;
        updateHistoryDisplay();
        showConfirmation('History cleared');
      });
    };

    function showConfirmationDialog(message, onConfirm) {
      const overlay = document.createElement('div');
      overlay.style.cssText = `position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:1000`;
      const modal = document.createElement('div');
      modal.style.cssText = `background:${SURFACE};border-radius:16px;padding:24px;max-width:300px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3)`;
      modal.innerHTML = `
        <div style="color:${TEXT};font-size:16px;margin-bottom:24px;font-weight:500">${message}</div>
        <div style="display:flex;gap:12px">
          <button style="flex:1;padding:10px;background:${DIM}44;color:${TEXT};border:none;border-radius:8px;cursor:pointer;font-weight:600" onclick="this.parentElement.parentElement.parentElement.remove()">Cancel</button>
          <button style="flex:1;padding:10px;background:${ACCENT};color:#0f0f13;border:none;border-radius:8px;cursor:pointer;font-weight:600" onclick="this.parentElement.parentElement.parentElement.remove();">Confirm</button>
        </div>
      `;
      const confirmBtn = modal.querySelector('button:last-child');
      confirmBtn.onclick = () => {
        overlay.remove();
        onConfirm();
      };
      overlay.appendChild(modal);
      document.body.appendChild(overlay);
      overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
    }

    function showConfirmation(message) {
      const toast = document.createElement('div');
      toast.style.cssText = `position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:${ACCENT};color:#0f0f13;padding:12px 20px;border-radius:8px;z-index:1001;font-weight:600;animation:slideUp 0.3s ease`;
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => { toast.style.animation = 'slideDown 0.3s ease'; toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 2000);
    }

    function renderMode() {
      const c = document.getElementById('modeContent');
      c.className = 'mode-enter';
      switch(currentMode) {
        case 'basic': c.innerHTML = basicHTML(); setupBasic(); break;
        case 'scientific': c.innerHTML = scientificHTML(); setupScientific(); break;
        case 'programmer': c.innerHTML = programmerHTML(); setupProgrammer(); break;
        case 'stopwatch': c.innerHTML = stopwatchHTML(); setupStopwatch(); break;
        case 'equation': c.innerHTML = equationHTML(); break;
        case 'bmi': c.innerHTML = bmiHTML(); break;
        case 'age': c.innerHTML = ageHTML(); break;
        case 'unit': c.innerHTML = unitHTML(); setupUnit(); break;
        case 'cooking': c.innerHTML = cookingHTML(); setupCooking(); break;
        case 'currency': c.innerHTML = currencyHTML(); setupCurrency(); break;
        case 'timezone': c.innerHTML = timezoneHTML(); break;
        case 'mortgage': c.innerHTML = mortgageHTML(); break;
        case 'percentage': c.innerHTML = percentHTML(); break;
        case 'tip': c.innerHTML = tipHTML(); break;
        case 'discount': c.innerHTML = discountHTML(); break;
        case 'shopping': c.innerHTML = shoppingHTML(); setupShopping(); break;
        case 'geometry': c.innerHTML = geometryHTML(); break;
      }
      lucide.createIcons();
    }

    // ============== BASIC ==============
    function basicHTML() {
      calcDisplay='0'; calcPrev=''; calcOp=''; calcReset=false;
      const btns = [
        ['C','func'],['±','func'],['%','func'],['÷','op'],
        ['7','num'],['8','num'],['9','num'],['×','op'],
        ['4','num'],['5','num'],['6','num'],['−','op'],
        ['1','num'],['2','num'],['3','num'],['+','op'],
        ['0','num'],['.','num'],['⌫','func'],['=','accent'],
      ];
      return `
        <div class="surface-bg rounded-2xl p-4 mb-3" style="background:${SURFACE}">
          <div class="text-dim text-xs text-right h-5 font-display" id="calcPrev" style="color:${DIM}"></div>
          <div class="text-main text-right text-4xl font-display font-bold truncate" id="calcDisp" style="color:${TEXT}">0</div>
        </div>
        <div class="grid grid-cols-4 gap-2 mb-3">
          ${btns.map(([l,t])=>`<button class="calc-btn calc-${t} h-14 text-lg" data-val="${l}">${l}</button>`).join('')}
        </div>`;
    }
    function setupBasic() {
      document.querySelectorAll('[data-val]').forEach(b => {
        b.onclick = (e) => {
          e.preventDefault();
          b.classList.add('pressed');
          setTimeout(() => b.classList.remove('pressed'), 200);
          handleBasicBtn(b.dataset.val);
        };
      });
      updateHistoryDisplay();
    }
    function handleBasicBtn(v) {
      const d = document.getElementById('calcDisp');
      const p = document.getElementById('calcPrev');
      if ('0123456789'.includes(v)) {
        calcDisplay = (calcDisplay==='0'||calcReset) ? v : calcDisplay+v;
        calcReset = false;
      } else if (v==='.') {
        if (calcReset) { calcDisplay='0'; calcReset=false; }
        if (!calcDisplay.includes('.')) calcDisplay+='.';
      } else if (v==='C') { calcDisplay='0'; calcPrev=''; calcOp=''; calcReset=false; p.textContent=''; }
      else if (v==='⌫') { calcDisplay = calcDisplay.length>1 ? calcDisplay.slice(0,-1) : '0'; }
      else if (v==='±') { calcDisplay = calcDisplay.startsWith('-') ? calcDisplay.slice(1) : '-'+calcDisplay; }
      else if (v==='%') { calcDisplay = String(parseFloat(calcDisplay)/100); }
      else if ('÷×−+'.includes(v)) {
        if (calcOp && !calcReset) calcDisplay = String(evaluate(parseFloat(calcPrev), parseFloat(calcDisplay), calcOp));
        calcPrev = calcDisplay; calcOp = v; calcReset = true;
        p.textContent = calcPrev+' '+v;
      } else if (v==='=') {
        if (calcOp) {
          const r = evaluate(parseFloat(calcPrev), parseFloat(calcDisplay), calcOp);
          const calculation = calcPrev+' '+calcOp+' '+calcDisplay;
          p.textContent = calculation+' =';
          calcDisplay = String(r); calcOp=''; calcReset=true;
          addToHistory(calcDisplay, calculation);
        }
      }
      d.textContent = calcDisplay;
      d.classList.remove('result-flash');
      void d.offsetWidth;
      d.classList.add('result-flash');
    }
    function evaluate(a,b,op) {
      switch(op) { case '+': return a+b; case '−': return a-b; case '×': return a*b; case '÷': return b!==0?a/b:'Error'; }
    }

    // History functions
    function addToHistory(value, calculation = '', tool = currentMode) {
      fullHistory.push({ tool, calculation: calculation || value, result: value, timestamp: new Date().toLocaleTimeString() });
      calcHistory = calcHistory.slice(0, calcHistoryIndex + 1);
      calcHistory.push(value);
      calcHistoryIndex = calcHistory.length - 1;
      updateHistoryDisplay();
    }
    window.undoCalc = function() {
      if (calcHistoryIndex > 0) {
        calcHistoryIndex--;
        calcDisplay = calcHistory[calcHistoryIndex];
        document.getElementById('calcDisp').textContent = calcDisplay;
        updateHistoryDisplay();
      }
    };
    window.redoCalc = function() {
      if (calcHistoryIndex < calcHistory.length - 1) {
        calcHistoryIndex++;
        calcDisplay = calcHistory[calcHistoryIndex];
        document.getElementById('calcDisp').textContent = calcDisplay;
        updateHistoryDisplay();
      }
    };
    function updateHistoryDisplay() {
      const list = document.getElementById('historyListPanel');
      if (!list) return;
      if (fullHistory.length === 0) {
        list.innerHTML = `<div class="flex items-center justify-center h-full text-center" style="color:${DIM}44;padding:40px 20px">
          <div style="font-size:14px;font-weight:500">No history yet</div>
        </div>`;
        return;
      }
      list.innerHTML = fullHistory.map((h, i) => `
        <div class="p-3 rounded-lg cursor-pointer transition text-xs font-display" 
             style="background:${SURFACE};color:${DIM};border-left:2px solid ${ACCENT}"
             title="${h.timestamp}">
          <div class="text-xs accent-text mb-1" style="color:${ACCENT}">${h.tool}</div>
          <div class="text-main" style="color:${TEXT}">${h.calculation}</div>
          <div class="text-dim mt-1" style="color:${ACCENT}">= ${h.result}</div>
        </div>
      `).join('');
    }

    // ============== SCIENTIFIC ==============
    function scientificHTML() {
      calcDisplay='0'; calcPrev=''; calcOp=''; calcReset=false; sciDeg=true;
      const row1 = [['sin','func'],['cos','func'],['tan','func'],['π','func'],['e','func']];
      const row2 = [['asin','func'],['acos','func'],['atan','func'],['sinh','func'],['cosh','func']];
      const row3 = [['x²','func'],['√','func'],['∛','func'],['xʸ','op'],['log','func']];
      const row4 = [['ln','func'],['log₂','func'],['1/x','func'],['tanh','func'],['abs','func']];
      const row5 = [['!','func'],['nPr','func'],['nCr','func'],['mod','func'],['gcd','func']];
      const row6 = [['C','func'],['±','func'],['%','func'],['⌊','func'],['⌈','func']];
      const row7 = [['sin⁻¹','func'],['cos⁻¹','func'],['tan⁻¹','func'],['coth','func'],['sech','func']];
      const row8 = [['Rand','func'],['φ','func'],['∞','func'],['π²','func'],['e²','func']];
      const main = [
        ['7','num'],['8','num'],['9','num'],['÷','op'],
        ['4','num'],['5','num'],['6','num'],['×','op'],
        ['1','num'],['2','num'],['3','num'],['−','op'],
        ['0','num'],['.','num'],['+','op'],['=','accent'],
      ];
      return `
        <div class="surface-bg rounded-2xl p-4 mb-3" style="background:${SURFACE}">
          <div class="text-dim text-xs text-right h-5 font-display" id="calcPrev" style="color:${DIM}"></div>
          <div class="text-main text-right text-3xl font-display font-bold truncate" id="calcDisp" style="color:${TEXT}">0</div>
          <div class="text-xs text-right mt-1" id="memoryDisplay" style="color:${ACCENT};min-height:16px"></div>
        </div>
        <div class="grid grid-cols-5 gap-0.5 mb-0.5" style="background:${SURFACE}22;padding:6px;border-radius:12px">
          ${row1.map(([l,t])=>`<button class="calc-btn calc-${t} h-8 text-xs" style="background:${DIM}22;color:${ACCENT};border-radius:6px" data-sci="${l}">${l}</button>`).join('')}
        </div>
        <div class="grid grid-cols-5 gap-0.5 mb-0.5" style="background:${SURFACE}22;padding:6px;border-radius:12px">
          ${row2.map(([l,t])=>`<button class="calc-btn calc-${t} h-8 text-xs" style="background:${DIM}22;color:${ACCENT};border-radius:6px" data-sci="${l}">${l}</button>`).join('')}
        </div>
        <div class="grid grid-cols-5 gap-0.5 mb-0.5" style="background:${SURFACE}22;padding:6px;border-radius:12px">
          ${row3.map(([l,t])=>`<button class="calc-btn calc-${t} h-8 text-xs" style="background:${DIM}22;color:${ACCENT};border-radius:6px" data-sci="${l}">${l}</button>`).join('')}
        </div>
        <div class="grid grid-cols-5 gap-0.5 mb-0.5" style="background:${SURFACE}22;padding:6px;border-radius:12px">
          ${row4.map(([l,t])=>`<button class="calc-btn calc-${t} h-8 text-xs" style="background:${DIM}22;color:${ACCENT};border-radius:6px" data-sci="${l}">${l}</button>`).join('')}
        </div>
        <div class="grid grid-cols-5 gap-0.5 mb-0.5" style="background:${SURFACE}22;padding:6px;border-radius:12px">
          ${row5.map(([l,t])=>`<button class="calc-btn calc-${t} h-8 text-xs" style="background:${DIM}22;color:${ACCENT};border-radius:6px" data-sci="${l}">${l}</button>`).join('')}
        </div>
        <div class="grid grid-cols-5 gap-0.5 mb-0.5" style="background:${SURFACE}22;padding:6px;border-radius:12px">
          ${row6.map(([l,t])=>`<button class="calc-btn calc-${t} h-8 text-xs" style="background:${DIM}22;color:${ACCENT};border-radius:6px" data-sci="${l}">${l}</button>`).join('')}
        </div>
        <div class="grid grid-cols-5 gap-0.5 mb-0.5" style="background:${SURFACE}22;padding:6px;border-radius:12px">
          ${row7.map(([l,t])=>`<button class="calc-btn calc-${t} h-8 text-xs" style="background:${DIM}22;color:${ACCENT};border-radius:6px" data-sci="${l}">${l}</button>`).join('')}
        </div>

    function handleSci(v, btn) {
      const d = document.getElementById('calcDisp');
      const p = document.getElementById('calcPrev');
      const n = parseFloat(calcDisplay);
      const toRad = x => sciDeg ? x*Math.PI/180 : x;
      const fromRad = x => sciDeg ? x*180/Math.PI : x;
      
      // Factorial helper
      const factorial = x => { let f=1; for(let i=2;i<=Math.floor(Math.abs(x));i++)f*=i; return f; };
      // GCD helper
      const gcd = (a, b) => b === 0 ? Math.abs(a) : gcd(b, a % b);
      // LCM helper
      const lcm = (a, b) => Math.abs(a * b) / gcd(a, b);

      if ('0123456789'.includes(v)) { calcDisplay=(calcDisplay==='0'||calcReset)?v:calcDisplay+v; calcReset=false; }
      else if (v==='.') { if(calcReset){calcDisplay='0';calcReset=false;} if(!calcDisplay.includes('.'))calcDisplay+='.'; }
      else if (v==='C') { calcDisplay='0';calcPrev='';calcOp='';calcReset=false;p.textContent=''; }
      else if (v==='sin') { calcDisplay=String(Math.sin(toRad(n))); calcReset=true; }
      else if (v==='cos') { calcDisplay=String(Math.cos(toRad(n))); calcReset=true; }
      else if (v==='tan') { calcDisplay=String(Math.tan(toRad(n))); calcReset=true; }
      else if (v==='sin⁻¹') { calcDisplay=String(fromRad(Math.asin(n))); calcReset=true; }
      else if (v==='cos⁻¹') { calcDisplay=String(fromRad(Math.acos(n))); calcReset=true; }
      else if (v==='tan⁻¹') { calcDisplay=String(fromRad(Math.atan(n))); calcReset=true; }
      else if (v==='asin') { calcDisplay=String(fromRad(Math.asin(n))); calcReset=true; }
      else if (v==='acos') { calcDisplay=String(fromRad(Math.acos(n))); calcReset=true; }
      else if (v==='atan') { calcDisplay=String(fromRad(Math.atan(n))); calcReset=true; }
      else if (v==='sinh') { calcDisplay=String(Math.sinh(n)); calcReset=true; }
      else if (v==='cosh') { calcDisplay=String(Math.cosh(n)); calcReset=true; }
      else if (v==='tanh') { calcDisplay=String(Math.tanh(n)); calcReset=true; }
      else if (v==='coth') { calcDisplay=String(1/Math.tanh(n)); calcReset=true; }
      else if (v==='sech') { calcDisplay=String(1/Math.cosh(n)); calcReset=true; }
      else if (v==='π') { calcDisplay=String(Math.PI); calcReset=true; }
      else if (v==='π²') { calcDisplay=String(Math.PI * Math.PI); calcReset=true; }
      else if (v==='e') { calcDisplay=String(Math.E); calcReset=true; }
      else if (v==='e²') { calcDisplay=String(Math.E * Math.E); calcReset=true; }
      else if (v==='φ') { calcDisplay=String((1 + Math.sqrt(5)) / 2); calcReset=true; }
      else if (v==='∞') { calcDisplay='Infinity'; calcReset=true; }
      else if (v==='Rand') { calcDisplay=String(Math.random()); calcReset=true; }
      else if (v==='x²') { calcDisplay=String(n*n); calcReset=true; }
      else if (v==='√') { calcDisplay=String(Math.sqrt(n)); calcReset=true; }
      else if (v==='∛') { calcDisplay=String(Math.cbrt(n)); calcReset=true; }
      else if (v==='^3') { calcDisplay=String(Math.pow(n,3)); calcReset=true; }
      else if (v==='log') { calcDisplay=String(Math.log10(n)); calcReset=true; }
      else if (v==='log₂') { calcDisplay=String(Math.log2(n)); calcReset=true; }
      else if (v==='ln') { calcDisplay=String(Math.log(n)); calcReset=true; }
      else if (v==='1/x') { calcDisplay=String(1/n); calcReset=true; }
      else if (v==='abs') { calcDisplay=String(Math.abs(n)); calcReset=true; }
      else if (v==='!') { calcDisplay=String(factorial(n)); calcReset=true; }
      else if (v==='nPr') { calcDisplay='nPr'; calcReset=true; }
      else if (v==='nCr') { calcDisplay='nCr'; calcReset=true; }
      else if (v==='mod') { calcDisplay='mod'; calcReset=true; }
      else if (v==='gcd') { calcDisplay='gcd'; calcReset=true; }
      else if (v==='⌊') { calcDisplay=String(Math.floor(n)); calcReset=true; }
      else if (v==='⌈') { calcDisplay=String(Math.ceil(n)); calcReset=true; }
      else if (v==='±') { calcDisplay = calcDisplay.startsWith('-') ? calcDisplay.slice(1) : '-'+calcDisplay; }
      else if (v==='%') { calcDisplay = String(parseFloat(calcDisplay)/100); }
      else if (v==='DEG') { sciDeg=!sciDeg; btn.textContent=sciDeg?'DEG':'RAD'; return; }
      else if ('÷×−+'.includes(v)||v==='xʸ') {
        const op = v==='xʸ'?'^':v;
        if(calcOp&&!calcReset) calcDisplay=String(evalSci(parseFloat(calcPrev),n,calcOp));
        calcPrev=calcDisplay; calcOp=op; calcReset=true;
        p.textContent=calcPrev+' '+v;

      else if (v==='=') {
        if(calcOp){ const r=evalSci(parseFloat(calcPrev),n,calcOp); p.textContent=calcPrev+' '+calcOp+' '+calcDisplay+' ='; calcDisplay=String(r);calcOp='';calcReset=true; addToHistory(calcDisplay, calcPrev + ' ' + calcOp + ' ' + n); }
      }
      else if (['MC','MR','M+','M-','M×'].includes(v)) {
        window.handleMemory(v);
        return;
      }
      const num = parseFloat(calcDisplay);
      if (!isNaN(num) && calcDisplay.length > 12) calcDisplay = parseFloat(num.toPrecision(10)).toString();
      d.textContent = calcDisplay;
      d.classList.remove('result-flash'); void d.offsetWidth; d.classList.add('result-flash');
    }

      switch(op){case '+':return a+b;case '−':return a-b;case '×':return a*b;case '÷':return b?a/b:'Error';case '^':return Math.pow(a,b);}

    function equationHTML() {
      return `

          <h2 class="text-main font-bold text-lg" style="color:${TEXT}">Equation Solver</h2>

          <input type="text" id="eqInput" class="input-field w-full rounded-xl px-4 py-3 text-sm outline-none border" style="background:${BG};color:${TEXT};border-color:${DIM}44" placeholder="Enter equation (use x for variable)">
          <button class="calc-btn calc-accent w-full h-12 text-sm font-bold rounded-xl" onclick="solveEquation(event)" style="background:${ACCENT};color:#0f0f13">Solve</button>

    window.solveEquation = function(e) {
      e.preventDefault();
      const eq = document.getElementById('eqInput').value.trim();
      try {
        const parts = eq.split('=');
        if (parts.length !== 2) { showConfirmation('Use format: 2x + 5 = 13 or x² - 5x + 6 = 0'); return; }
        const left = parts[0];
        const right = parseFloat(parts[1]);
        if (isNaN(right)) { showConfirmation('Invalid right side'); return; }
        
        const eqStr = left + ' - (' + right + ')';
        const normalized = eqStr.replace(/x²|x\^2/g, '({x})²').replace(/\^/g, '**');
        
        let a = 0, b = 0, c = 0;
        const isQuadratic = /x²|x\^2|\(\{x\}\)\²/.test(normalized);
        
        if (isQuadratic) {
          for (let i = -100; i <= 100; i += 0.1) {
            const testEq = normalized.replace(/{x}/g, i);
            const result = eval(testEq);
            if (Math.abs(result) < 0.0001) {
              a = 1;
              break;
            }
          }
          
          const coeffStr = left.replace(/\s+/g, '');
          const x2Match = coeffStr.match(/([+-]?\d*\.?\d*)x²|([+-]?\d*\.?\d*)x\^2/);
          const xMatch = coeffStr.match(/([+-]?\d*\.?\d*)x(?!²|\^)/);
          const constMatch = coeffStr.match(/([+-]\d+\.?\d*|^\d+\.?\d*)/);
          
          a = x2Match ? parseFloat(x2Match[1] || x2Match[2] || '1') : 0;
          b = xMatch ? parseFloat(xMatch[1] || '1') : 0;
          c = constMatch ? parseFloat(constMatch[1]) : 0;
          c = c - right;
          
          if (a === 0) {
            const x = -c / b;
            document.getElementById('eqVal').innerHTML = `<div class="text-sm text-dim" style="color:${DIM}">Solution</div><div class="text-2xl font-display font-bold accent-text" style="color:${ACCENT}">x = ${x.toFixed(4)}</div>`;
          } else {
            const disc = b * b - 4 * a * c;
            if (disc < 0) {
              document.getElementById('eqVal').innerHTML = `<div class="text-sm text-dim" style="color:${DIM}">No real solutions</div><div class="text-xs accent-text" style="color:${ACCENT}">Discriminant: ${disc.toFixed(2)}</div>`;
            } else if (disc === 0) {
              const x = -b / (2 * a);
              document.getElementById('eqVal').innerHTML = `<div class="text-sm text-dim" style="color:${DIM}">One Solution</div><div class="text-2xl font-display font-bold accent-text" style="color:${ACCENT}">x = ${x.toFixed(4)}</div>`;
            } else {
              const x1 = (-b + Math.sqrt(disc)) / (2 * a);
              const x2 = (-b - Math.sqrt(disc)) / (2 * a);
              document.getElementById('eqVal').innerHTML = `<div class="text-sm text-dim" style="color:${DIM}">Two Solutions</div><div class="space-y-2 mt-2"><div class="text-lg font-display font-bold accent-text" style="color:${ACCENT}">x₁ = ${x1.toFixed(4)}</div><div class="text-lg font-display font-bold accent-text" style="color:${ACCENT}">x₂ = ${x2.toFixed(4)}</div></div>`;
            }
          }
        } else {
          for (let i = -10000; i <= 10000; i++) {
            const testEq = normalized.replace(/{x}/g, i);
            const result = eval(testEq);
            if (Math.abs(result) < 0.01) {
              document.getElementById('eqVal').innerHTML = `<div class="text-sm text-dim" style="color:${DIM}">Solution</div><div class="text-2xl font-display font-bold accent-text" style="color:${ACCENT}">x = ${i.toFixed(4)}</div>`;
              const r = document.getElementById('eqResult');
              r.classList.remove('hidden');
              r.classList.add('result-flash');
              return;
            }
          }
          showConfirmation('No solution found');
          return;
        }
        
        const r = document.getElementById('eqResult');
        r.classList.remove('hidden');
        r.classList.add('result-flash');
      } catch (err) {
        showConfirmation('Invalid equation format');
      }
    };

    window.calcAge = function(e) {
      e.preventDefault();
      const input = document.getElementById('ageDob').value.trim();
      if (!input) return;
      
      const parts = input.split('/');
      if (parts.length !== 3) { showConfirmation('Use format: MM/DD/YY'); return; }
      
      let month = parseInt(parts[0]), day = parseInt(parts[1]), year = parseInt(parts[2]);
      
      if (isNaN(month) || isNaN(day) || isNaN(year) || month < 1 || month > 12 || day < 1 || day > 31) {
        showConfirmation('Invalid date');
        return;
      }
      
      year = year > 50 ? 1900 + year : 2000 + year;
      const dob = new Date(year, month - 1, day);
      if (isNaN(dob) || dob > new Date()) { showConfirmation('Invalid date or future date'); return; }
      
      const now = new Date();
      let y = now.getFullYear() - dob.getFullYear(), m = now.getMonth() - dob.getMonth(), d = now.getDate() - dob.getDate();
      if (d < 0) { m--; d += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
      if (m < 0) { y--; m += 12; }
      const totalD = Math.floor((now - dob) / (1000 * 60 * 60 * 24));
      let next = new Date(now.getFullYear(), dob.getMonth(), dob.getDate());
      if (next <= now) next.setFullYear(next.getFullYear() + 1);
      const daysNext = Math.ceil((next - now) / (1000 * 60 * 60 * 24));

    const timezones = {

    window.convertTime = function() {

      const offset = (timezones[to]||0) - (timezones[from]||0);
      let nh=(h+Math.floor(offset))%24; if(nh<0)nh+=24;
      document.getElementById('tzOut').textContent=`${nh.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
    };
    function timezoneInit() {
      const tzs = Object.keys(timezones);
      ['tzFrom','tzTo'].forEach((id,i)=>{ document.getElementById(id).innerHTML=tzs.map((t,j)=>`<option value="${t}" ${j===i?'selected':''}>${t}</option>`).join(''); });
    }

    window.calcDiscount = function(e) {

      document.getElementById('discOff').textContent=pct+'%';

      addToHistory(newPrice.toFixed(2), orig + ' with ' + pct + '% off', 'discount');

    window.calcOrigPrice = function(e) {

      const sale=parseFloat(document.getElementById('discSalePrice').value), pct=parseFloat(document.getElementById('discSalePct').value);

      const orig=sale/(1-pct/100);
      document.getElementById('discOrig').textContent='$'+orig.toFixed(2);
      const r=document.getElementById('discResult2'); r.classList.remove('hidden'); r.classList.add('result-flash');
      addToHistory(orig.toFixed(2), sale + ' with ' + pct + '% discount reverse', 'discount');
    };

    function geometryHTML() {
      return `
        <div class="surface-bg rounded-2xl p-5 space-y-4" style="background:${SURFACE}">
          <h2 class="text-main font-bold text-lg" style="color:${TEXT}">Geometry Calculator</h2>
          <div>
            <label class="text-dim text-xs block mb-1" style="color:${DIM}">Shape</label>
            <select id="geoShape" class="input-field w-full rounded-xl px-4 py-3 text-sm outline-none border" style="background:${BG};color:${TEXT};border-color:${DIM}44" onchange="updateGeoInputs()">
              <option value="circle">Circle (Area/Circumference)</option>
              <option value="rectangle">Rectangle (Area/Perimeter)</option>
              <option value="triangle">Triangle (Area)</option>
              <option value="sphere">Sphere (Volume/Surface)</option>
              <option value="cylinder">Cylinder (Volume/Surface)</option>
              <option value="cube">Cube (Volume/Surface)</option>
              <option value="pyramid">Pyramid (Volume)</option>
              <option value="cone">Cone (Volume/Surface)</option>
            </select>
          </div>
          <div id="geoInputs" class="space-y-3"></div>
          <button class="calc-btn calc-accent w-full h-12 text-sm font-bold rounded-xl" onclick="calcGeometry(event)" style="background:${ACCENT};color:#0f0f13">Calculate</button>

            <div id="geoOutput" class="space-y-2"></div>
          </div>
        </div>`;
    }
    window.updateGeoInputs = function() {
      const shape=document.getElementById('geoShape').value;
      const inputs=document.getElementById('geoInputs');
      const createInput=(label,id)=>`<div><label class="text-dim text-xs block mb-1" style="color:${DIM}">${label}</label><input type="number" id="${id}" class="input-field w-full rounded-xl px-4 py-3 text-sm outline-none border" style="background:${BG};color:${TEXT};border-color:${DIM}44" placeholder="0"></div>`;
      
      const shapes={
        circle:`${createInput('Radius','geoRadius')}`,
        rectangle:`${createInput('Length','geoLength')}${createInput('Width','geoWidth')}`,
        triangle:`${createInput('Base','geoBase')}${createInput('Height','geoHeight')}`,
        sphere:`${createInput('Radius','geoRadius')}`,
        cylinder:`${createInput('Radius','geoRadius')}${createInput('Height','geoHeight')}`,
        cube:`${createInput('Side Length','geoSide')}`,
        pyramid:`${createInput('Base Area','geoBaseArea')}${createInput('Height','geoHeight')}`,
        cone:`${createInput('Radius','geoRadius')}${createInput('Height','geoHeight')}`
      };
      inputs.innerHTML=shapes[shape];
    };
    window.calcGeometry = function(e) {
      e.preventDefault();
      const shape=document.getElementById('geoShape').value;
      let result={};
      
      const getVal=id=>{const el=document.getElementById(id);return el?parseFloat(el.value):NaN;};
      
      if(shape==='circle'){
        const r=getVal('geoRadius');
        if(isNaN(r)||r<=0)return;
        result={area:(Math.PI*r*r).toFixed(4),circumference:(2*Math.PI*r).toFixed(4)};
      }else if(shape==='rectangle'){
        const l=getVal('geoLength'),w=getVal('geoWidth');
        if(isNaN(l)||isNaN(w)||l<=0||w<=0)return;
        result={area:(l*w).toFixed(4),perimeter:(2*(l+w)).toFixed(4)};
      }else if(shape==='triangle'){
        const b=getVal('geoBase'),h=getVal('geoHeight');
        if(isNaN(b)||isNaN(h)||b<=0||h<=0)return;
        result={area:(0.5*b*h).toFixed(4)};
      }else if(shape==='sphere'){
        const r=getVal('geoRadius');
        if(isNaN(r)||r<=0)return;
        result={volume:(4/3*Math.PI*r*r*r).toFixed(4),surface:(4*Math.PI*r*r).toFixed(4)};
      }else if(shape==='cylinder'){
        const r=getVal('geoRadius'),h=getVal('geoHeight');
        if(isNaN(r)||isNaN(h)||r<=0||h<=0)return;
        result={volume:(Math.PI*r*r*h).toFixed(4),surface:(2*Math.PI*r*(r+h)).toFixed(4)};
      }else if(shape==='cube'){
        const s=getVal('geoSide');
        if(isNaN(s)||s<=0)return;
        result={volume:(s*s*s).toFixed(4),surface:(6*s*s).toFixed(4)};
      }else if(shape==='pyramid'){
        const ba=getVal('geoBaseArea'),h=getVal('geoHeight');
        if(isNaN(ba)||isNaN(h)||ba<=0||h<=0)return;
        result={volume:(1/3*ba*h).toFixed(4)};
      }else if(shape==='cone'){
        const r=getVal('geoRadius'),h=getVal('geoHeight');
        if(isNaN(r)||isNaN(h)||r<=0||h<=0)return;
        const slant=Math.sqrt(r*r+h*h);
        result={volume:(1/3*Math.PI*r*r*h).toFixed(4),surface:(Math.PI*r*(r+slant)).toFixed(4)};
      }
      
      const output=document.getElementById('geoOutput');
      output.innerHTML=Object.entries(result).map(([k,v])=>`
        <div class="flex justify-between items-center"><span class="text-dim text-sm capitalize" style="color:${DIM}">${k}:</span><span class="font-display font-bold accent-text text-lg" style="color:${ACCENT}">${v}</span></div>
      `).join('');
      const r=document.getElementById('geoResult'); r.classList.remove('hidden'); r.classList.add('result-flash');
    };

  </script>
